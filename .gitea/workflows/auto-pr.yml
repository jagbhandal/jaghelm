name: Auto PR from Staging

on:
  push:
    branches:
      - staging

jobs:
  create-pr:
    runs-on: self-hosted
    steps:
      - name: Create or update PR
        env:
          # Pass untrusted inputs through env (never interpolate ${{ }} directly
          # into the shell script — that is a command-injection vector).
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_SHA: ${{ github.sha }}
          API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu

          # The token goes to curl on stdin as a config line (printf is a shell builtin),
          # never on argv where /proc/<pid>/cmdline would expose it (#335).
          auth() { printf 'header = "Authorization: token %s"\n' "${PR_TOKEN}"; }

          EXISTING=$(auth | /usr/bin/curl -sf -K - \
            "${API_BASE}/pulls?state=open&head=staging&base=main" || true)

          if echo "$EXISTING" | grep -q '"number"'; then
            echo "Open PR already exists — skipping"
            exit 0
          fi

          TITLE=$(printf '%s' "$HEAD_COMMIT_MSG" | head -1)
          BODY="Auto-created from push to staging. Commit: ${GH_SHA}"

          # Build correctly-escaped JSON in pure bash (the runner has no jq) — escape
          # backslash + double-quote so a quote/${...} in the commit message can't
          # break the body or inject fields. TITLE is a single line (head -1) and BODY
          # is single-line, so no newline escaping is needed.
          json_escape() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
          PAYLOAD=$(printf '{"title":"%s","head":"staging","base":"main","body":"%s"}' \
            "$(json_escape "$TITLE")" "$(json_escape "$BODY")")

          # stdin carries the auth config, so the body goes in a file.
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$PAYLOAD" > "$BODY_FILE"
          auth | /usr/bin/curl -sf -K - -X POST \
              -H "Content-Type: application/json" \
              "${API_BASE}/pulls" --data @"$BODY_FILE"

          echo "PR created: ${TITLE}"