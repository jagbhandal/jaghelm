# .harness.yml — harness conformance manifest for jaghelm.
#
# Assessed against main at a26401df (2026-11-02). Levels are the on-disk
# verifiable reality (honest-numbers): runtime/branch-only claims do NOT count.
# Levels & criteria: homelab-infra/docs/harness/MATURITY-RUBRIC.md
# Target bars (web-app): ctx L2 · leg L2 · enf L3 · ver L3 · gc L2 · aut L2.

archetype: web-app

levels:
  # = target L2: AGENTS.md is a map (<=100 lines) into structured docs/ (ARCHITECTURE,
  # ADRs, security/, slos/). Not L3: nothing checks docs are fresh or cross-linked
  # (doc-counts.test.mjs guards counts only), and docs/ARCHITECTURE.md is one very
  # long page the map points into by section.
  context:      L2
  # = target L2: boots in isolation (DEMO_MODE, scripts/dev-server.mjs, docs/DEMO.md);
  # server/metrics.js (prom-client) + server/util/logger.js give queryable signals; the
  # gallery and e2e render the UI in a browser.
  legibility:   L2
  # = target L3: lint, typecheck, secret scan, npm audit and first-load budgets block in CI,
  # and the structural source scanners state the fix in their failure message next to the
  # offending file:line: author-strings, no-browser-dialogs, phone-imports, phone-no-severity,
  # settings-places, lazy-views, themes, doc-counts, image-pin-docs (audited 2026-11-02).
  # Not audited: the parity and config tests (ci-workflows, docker-image, gallery-build,
  # deploy-workflow, workflow-token-argv, fonts, ui-contrast); their output is diagnostic,
  # not remediation. New scanners must name the fix, like the ones above.
  enforcers:    L3
  # GAP (target L3): check.yml runs on every PR to main (secret scan, changelog format,
  # audit, lint, typecheck, backend + client tests, asset check, first-load budgets) and a
  # second job runs gallery screenshots + axe and the app-shell e2e. That is L2: blocking
  # trigger on every change. L3 needs an agent-to-agent review loop before a human looks;
  # none is on disk (scoped in homelab-infra docs/harness/VERIFICATION-L3-SCOPE.md).
  verification: L2
  # GAP (target L2): no QUALITY_SCORE.md and no golden-principles doc. CHANGELOG fragments
  # and doc-counts.test.mjs are small entropy controls; docs/IMPROVEMENT-PLAN.md is a
  # one-off audit from 2026-06-17. gc L1 = no quality-grade doc.
  gc:           L1
  # = target L2: auto-pr.yml opens staging->main PR (human merges); deploy.yml runs with
  # serialized concurrency + opt-in cosign verify + health gate with auto-rollback;
  # reconcile.yml is the safety net. The merge/deploy gate is held by a human.
  autonomy:     L2

evidence:
  context:      [AGENTS.md, docs/ARCHITECTURE.md, docs/adr/README.md, docs/security/STRIDE.md, docs/slos/README.md]
  legibility:   [server/demo.js, docs/DEMO.md, scripts/dev-server.mjs, server/metrics.js, server/util/logger.js, server/observability.test.js]
  enforcers:    [eslint.config.js, .gitea/workflows/check.yml, .github/workflows/build-push.yml, scripts/no-browser-dialogs.test.mjs, scripts/phone-imports.test.mjs, scripts/phone-no-severity.test.mjs, scripts/author-strings.test.mjs, scripts/settings-places.test.mjs, scripts/lazy-views.test.mjs]
  verification: [.gitea/workflows/check.yml, .github/workflows/build-push.yml, scripts/check-assets.mjs, scripts/first-load.mjs, e2e/app.mjs]
  gc:           [CHANGELOG.md, docs/IMPROVEMENT-PLAN.md]
  autonomy:     [.gitea/workflows/auto-pr.yml, .gitea/workflows/deploy.yml, .gitea/workflows/reconcile.yml]

last_audited: 2026-11-02
