name: Build Signed Mobile APK

# Builds a SIGNED release APK for sideload (no Play Store) on a `mobile-v*` tag,
# or on demand via workflow_dispatch. Signing material is injected from GitHub
# Actions secrets, decoded to a temp file, and SHREDDED in an `if: always()` step
# so it never persists in the workspace. No secret value is ever echoed.
#
# Required repo secrets (see docs/mobile/KEYSTORE.md + docs/mobile/PUSH-SETUP.md):
#   KEYSTORE_BASE64             — `base64 -w0 < jaghelm-release.jks`
#   KEYSTORE_PASSWORD           — keystore (store) password
#   KEY_ALIAS                   — signing key alias (e.g. jaghelm-upload)
#   KEY_PASSWORD                — key (alias) password
#   GOOGLE_SERVICES_JSON_BASE64 — `base64 -w0 < google-services.json` (Firebase client
#                                 config; makes the release APK ship with push/FCM enabled)
#
# Graceful fallback: mobile/android/app/build.gradle keys signing on the presence of
# `keystore.properties`, and BOTH the Vite build (__PUSH_ENABLED__) and the google-services
# Gradle plugin key push on the presence of `google-services.json`. If either secret is unset
# the corresponding step fails fast (intentional) rather than silently shipping an
# unsigned/debug-signed APK, or one with push compiled out.
#
# Release (push of a mobile-vX.Y.Z tag), in two jobs:
#   build    (contents: read) The tag must equal mobile/package.json's version and
#            mobile/CHANGELOG.md must have a section for it, both checked before the
#            build. After the build, signature check, shredding and leak guard, the
#            APK is renamed jaghelm-android-X.Y.Z.apk, hashed and uploaded as an
#            artifact.
#   release  (contents: write, no signing secrets, no npm/Gradle) Downloads that
#            artifact, checks it against the build job's SHA-256, and attaches it
#            to a new GitHub Release "JagHelm Android X.Y.Z" with notes from
#            scripts/release-notes.mjs, created with --latest=false so Latest stays
#            on the server release. A release page that already exists is never
#            rewritten: the run fails instead.
#
# Dry run (workflow_dispatch, any ref): a test build (versionName
# 0.0.0-dispatch.N, versionCode N) that renders the release page for
# mobile/package.json's version into the job summary. The release job never runs.
#
# Tags are created on Gitea only and reach GitHub through the push mirror.
# Procedure: docs/RELEASING.md.
#
# Injection safety: the tag name reaches shell only through the runner's
# GITHUB_REF_NAME variable and is validated against ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$
# before any other use.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Holds the signing secrets and runs third-party build code (npm, Gradle, Vite),
  # so it gets read-only repository access. Publishing is the release job below.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      apk_sha256: ${{ steps.apk.outputs.sha256 }}
      commit: ${{ steps.apk.outputs.commit }}

    steps:
      # Runs before checkout so nothing uses an unvalidated tag. Later steps read
      # RELEASE, TAG and VERSION from $GITHUB_ENV.
      - name: Resolve release mode
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                echo "::error::push event is not a tag push"
                exit 1
              fi
              if [[ ! "$GITHUB_REF_NAME" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::release tags must look like mobile-vMAJOR.MINOR.PATCH (e.g. mobile-v1.1.0)"
                exit 1
              fi
              TAG="$GITHUB_REF_NAME"
              VERSION="${TAG#mobile-v}"
              {
                echo "RELEASE=true"
                echo "TAG=$TAG"
                echo "VERSION=$VERSION"
              } >> "$GITHUB_ENV"
              echo "release build for $TAG"
              ;;
            workflow_dispatch)
              # VERSION comes from mobile/package.json after checkout.
              echo "RELEASE=false" >> "$GITHUB_ENV"
              echo "dry run: test build, no release"
              ;;
            *)
              echo "::error::unsupported event"
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Nothing here uses git credentials; keep the token out of .git/config,
          # out of reach of the build's third-party code.
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          # Capacitor 8's android modules compile at JavaVersion.VERSION_21
          # (@capacitor/android .../capacitor/build.gradle source/targetCompatibility),
          # so the build JDK must be >= 21 or javac fails: "invalid source release: 21".
          # JDK 17 here previously failed assembleRelease at :capacitor-android:compileReleaseJavaWithJavac.
          java-version: '21'
          # Cache ~/.gradle/caches + wrapper keyed on the gradle files, so a cold
          # Android assembleRelease doesn't re-resolve the full AGP/AndroidX/Capacitor
          # graph every run. npm is already cached below; this matches that discipline.
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # --- Before the expensive build: the tag must name the version in
      # mobile/package.json, and mobile/CHANGELOG.md must have a releasable section
      # for it. Rendering the notes once (checksum not known yet) runs the same lint
      # and lookup as the final render, so a missing, Unreleased-only or malformed
      # section fails here in seconds. The script uses Node built-ins only. ---
      - name: Check the version file and the CHANGELOG
        run: |
          set -euo pipefail
          PKG_VERSION="$(jq -r .version mobile/package.json)"
          if [[ "$RELEASE" == "true" ]]; then
            if [[ "$PKG_VERSION" != "$VERSION" ]]; then
              echo "::error::mobile/package.json version is $PKG_VERSION but the tag is $TAG"
              exit 1
            fi
            node scripts/release-notes.mjs android "$VERSION" \
              --apk "jaghelm-android-$VERSION.apk" --sha256 pending > /dev/null
            echo "mobile/package.json and mobile/CHANGELOG.md agree with $TAG"
          else
            if [[ ! "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::mobile/package.json version is not MAJOR.MINOR.PATCH"
              exit 1
            fi
            echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
            echo "dry run for mobile/package.json version $PKG_VERSION"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # --- Firebase client config: decode google-services.json BEFORE the Vite build.
      # Push is gated on this file at TWO layers that must agree: the Vite build sets
      # __PUSH_ENABLED__ from ./android/app/google-services.json (vite.config.mobile.js),
      # and Gradle applies the google-services plugin from the same file (app/build.gradle) —
      # so it must exist before `npm run build`. Placed before `npm ci` so a bad/missing
      # secret fails in seconds rather than after the install. NOT a secret (it ships inside
      # every APK) → intentionally not shredded and not flagged by the leak-guard below;
      # base64'd only to keep project IDs out of git (gitignored). See docs/mobile/PUSH-SETUP.md.
      - name: Inject Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 secret is required so the release APK ships with push (FCM) enabled — see docs/mobile/PUSH-SETUP.md}"

          DEST="mobile/android/app/google-services.json"
          # decode straight to file (see the keystore step for the printf/base64 rationale)
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "${DEST}"

          # Fail loud on a malformed/wrong secret rather than silently building a push-disabled
          # APK (the regression this step prevents). Two checks give DISTINCT operator errors:
          # invalid JSON (a botched base64 paste) vs the wrong Firebase project (valid JSON,
          # wrong app). EXPECTED must stay in sync with build.gradle applicationId /
          # capacitor.config.ts appId (asserted by mobile/capacitor.config.test.js).
          jq -e . "${DEST}" > /dev/null \
            || { echo "::error::decoded google-services.json is not valid JSON — check the GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }

          EXPECTED="io.jaghelm.app"
          jq -e --arg p "${EXPECTED}" \
            'any(.client[]?; .client_info.android_client_info.package_name == $p)' "${DEST}" > /dev/null \
            || { echo "::error::google-services.json has no client for ${EXPECTED} — wrong Firebase project/app in the GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }
          echo "google-services.json injected and validated for ${EXPECTED}"

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Build web bundle (Vite, mobile config)
        run: npm run build
        working-directory: mobile

      - name: Capacitor sync (android)
        run: npx cap sync android
        working-directory: mobile

      # --- Derive versionCode/versionName from the release tag. A fixed versionCode
      # would silently break the documented "bump tag -> install over the top" path:
      # some OEMs refuse a tap-install of an equal-versionCode APK. mobile-vMAJOR.MINOR.PATCH
      # maps to a monotonic versionCode (MAJOR*1e6 + MINOR*1e3 + PATCH). A
      # workflow_dispatch build is a clearly-marked, non-distribution test build,
      # whatever ref it runs on. ---
      - name: Derive app version
        run: |
          set -euo pipefail
          if [[ "$RELEASE" == "true" ]]; then
            # Up to three digits per part keeps the parts from overlapping in the
            # versionCode and keeps it below Android's 2100000000 limit.
            if [[ ! "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              echo "::error::version $VERSION has a part longer than three digits, which the versionCode scheme cannot represent"
              exit 1
            fi
            IFS=. read -r MAJ MIN PAT <<< "$VERSION"
            VNAME="$VERSION"
            # 10#: a leading zero must not be read as octal.
            VCODE=$(( 10#$MAJ*1000000 + 10#$MIN*1000 + 10#$PAT ))
          else
            VNAME="0.0.0-dispatch.${GITHUB_RUN_NUMBER:-0}"
            VCODE="${GITHUB_RUN_NUMBER:-1}"
          fi
          echo "VERSION_NAME=${VNAME}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=${VCODE}" >> "${GITHUB_ENV}"
          echo ">>> versionName=${VNAME} versionCode=${VCODE}"

      # --- Signing material: decode + write keystore.properties. Never echoes a secret. ---
      # The keystore is decoded into mobile/android/app/ (the Gradle module dir) so the
      # `storeFile` bare filename in keystore.properties resolves there. keystore.properties
      # is written next to build.gradle's `rootProject.file("app/keystore.properties")`.
      - name: Decode keystore and write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required to build a signed APK}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"

          APP_DIR="mobile/android/app"
          KEYSTORE_FILE="release.keystore"
          KEYSTORE_PATH="${APP_DIR}/${KEYSTORE_FILE}"

          # Decode base64 secret straight to file — the value never lands in an echo
          # or process-listing visible in logs. printf '%s' avoids trailing-newline
          # corruption of the keystore bytes; base64 -d is GNU coreutils on ubuntu-latest.
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"

          # Write keystore.properties from secrets via env (values never printed).
          # storeFile is a bare filename => file(...) resolves it relative to mobile/android/app/.
          {
            printf 'storeFile=%s\n'     "${KEYSTORE_FILE}"
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n'      "${KEY_ALIAS}"
            printf 'keyPassword=%s\n'   "${KEY_PASSWORD}"
          } > "${APP_DIR}/keystore.properties"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon -PversionCode="${VERSION_CODE}" -PversionName="${VERSION_NAME}"
        working-directory: mobile/android

      # --- Confirm the produced APK is actually SIGNED before we publish it. ---
      # A genuinely unsigned APK fails apksigner verify (non-zero exit) — fail loud
      # rather than upload an un-installable artifact. apksigner is on PATH via the
      # SDK build-tools that setup-android installs.
      - name: Verify APK signature (apksigner)
        run: |
          set -euo pipefail
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          : "${APK:?no release APK produced}"
          echo ">>> Verifying ${APK}"
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n1)
          : "${APKSIGNER:?apksigner not found in build-tools}"
          "${APKSIGNER}" verify --min-sdk-version 24 --print-certs -v "${APK}"

      # --- Cleanup runs even on failure; the ephemeral runner is the backstop, not the only line.
      # No `|| true` — rm -f already tolerates absent files, so a genuine failure here should
      # surface rather than be swallowed (the guard below then proves the material is gone). ---
      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          # shred (not rm): a self-hosted Gitea act_runner may use a persistent disk where
          # rm leaves recoverable bytes of the signing key. Same predicate as the guard below
          # so cleanup and detection can't drift; recursive in case a partial decode left a
          # truncated file. `-exec ... +` is a no-op when nothing matches.
          find mobile/android/app \
            \( -name 'keystore.properties' -o -name '*.keystore' -o -name '*.jks' \) \
            -exec shred -fu {} +

      # --- Artifact-secret guard. The signing material is written to the Gradle module dir
      # (mobile/android/app/), NOT to build/outputs/ — so the guard must scan THAT path to
      # actually verify the cleanup step shredded it, then double-check the upload glob. ---
      - name: Guard against secret leakage
        if: always()
        run: |
          set -euo pipefail
          # The keystore is written to mobile/android/app/ and the APK to its
          # build/outputs/ subtree, so one recursive scan of mobile/android/app both
          # proves the cleanup step shredded the signing material AND that none leaked
          # into the artifact path before upload. (keystore.properties.example lives one
          # level up in mobile/android/, outside this scan, so it never false-positives.)
          # NOTE: google-services.json is deliberately NOT matched here — it is the Firebase
          # CLIENT config and is meant to ship inside the APK (not a secret); see the Inject step.
          if find mobile/android/app \
               \( -name 'keystore.properties' -o -name '*.keystore' -o -name '*.jks' \) \
               -print -quit | grep -q .; then
            echo "::error::signing material present under mobile/android/app — cleanup failed or leaked into the artifact; refusing to upload"
            exit 1
          fi
          echo "no signing material under mobile/android/app — safe to upload"

      # --- Everything below runs only after the guard passed (default if: success()).
      # Exactly one APK may exist, so the file named, hashed and uploaded is the one
      # apksigner verified. Release builds rename it to its public name; the dry run
      # keeps the test build's name and hashes that. The name, checksum and commit
      # are handed to the release job as job outputs. ---
      - name: Name the APK and record its checksum
        id: apk
        run: |
          set -euo pipefail
          DIR="mobile/android/app/build/outputs/apk/release"
          mapfile -t apks < <(find "$DIR" -type f -name '*.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::expected exactly one APK under $DIR, found ${#apks[@]}"
            exit 1
          fi
          APK_PATH="${apks[0]}"
          if [[ "$RELEASE" == "true" ]]; then
            mv -- "$APK_PATH" "$DIR/jaghelm-android-$VERSION.apk"
            APK_PATH="$DIR/jaghelm-android-$VERSION.apk"
          fi
          SHA="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::could not compute the APK checksum"
            exit 1
          fi
          COMMIT="$(git rev-parse HEAD)"
          echo "$APK_PATH sha256 $SHA (commit $COMMIT)"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          {
            echo "name=$(basename "$APK_PATH")"
            echo "sha256=$SHA"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jaghelm-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          # Re-running all jobs replaces the earlier attempt's artifact instead of
          # failing on it.
          overwrite: true

      # --- Dry run only: the release page a tag would publish, with the test build's
      # checksum, in the job summary. If it cannot be rendered, the dry run fails as
      # the tag build would (the test APK is already uploaded above). ---
      - name: Render the release page (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if ! node scripts/release-notes.mjs android "$VERSION" \
              --apk "jaghelm-android-$VERSION.apk" --sha256 "$APK_SHA256" > notes.md; then
            echo "::error::release notes for $VERSION could not be rendered (see above); a mobile-v$VERSION tag would fail the same way"
            exit 1
          fi
          {
            echo "## Dry run — checksum is of this test build"
            echo
            echo "A \`mobile-v$VERSION\` tag would publish this as **JagHelm Android $VERSION**. Test build: versionName \`$VERSION_NAME\`, versionCode $VERSION_CODE."
            echo
            echo "---"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the APK the build job verified, uploaded and hashed. The only job with
  # write access. It holds no signing secrets and runs no npm, Gradle or Vite code:
  # first-party actions, gh, and scripts/release-notes.mjs (Node built-ins only).
  # "Re-run failed jobs" re-runs just this job against the same build.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Same tag validation as the build job, before anything else uses the tag.
      # The build job's outputs are checked too, before they are used.
      - name: Resolve the release
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must look like mobile-vMAJOR.MINOR.PATCH (e.g. mobile-v1.1.0)"
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#mobile-v}"
          if [[ "$APK_NAME" != "jaghelm-android-$VERSION.apk" ]]; then
            echo "::error::the build job did not report jaghelm-android-$VERSION.apk"
            exit 1
          fi
          if [[ ! "$APK_SHA256" =~ ^[0-9a-f]{64}$ || ! "$BUILT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the build job did not report a checksum and commit"
            exit 1
          fi
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "APK_NAME=$APK_NAME"
            echo "APK_SHA256=$APK_SHA256"
            echo "BUILT_COMMIT=$BUILT_COMMIT"
          } >> "$GITHUB_ENV"
          echo "releasing $APK_NAME (sha256 $APK_SHA256) from $BUILT_COMMIT as $TAG"

      # For mobile/CHANGELOG.md and scripts/ at the tag.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Nothing here pushes with git; keep the write token out of .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jaghelm-release-apk
          path: ${{ runner.temp }}/apk

      # The artifact must hold exactly the file the build job hashed, and the
      # notes must come from the commit that was built.
      - name: Verify the APK and the checkout
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/apk"
          mapfile -t files < <(find "$DIR" -type f)
          if (( ${#files[@]} != 1 )) || [[ "${files[0]}" != "$DIR/$APK_NAME" ]]; then
            echo "::error::the artifact must contain exactly $APK_NAME (found ${#files[@]} files)"
            exit 1
          fi
          if ! printf '%s  %s\n' "$APK_SHA256" "$DIR/$APK_NAME" | sha256sum --check --status; then
            echo "::error::the downloaded $APK_NAME does not match the checksum the build job computed"
            exit 1
          fi
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$HEAD_COMMIT" != "$BUILT_COMMIT" ]]; then
            echo "::error::checked out $HEAD_COMMIT, but the APK was built from $BUILT_COMMIT"
            exit 1
          fi
          echo "$APK_NAME matches sha256 $APK_SHA256; checkout is $BUILT_COMMIT"

      - name: Render release notes
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs android "$VERSION" \
            --apk "$APK_NAME" --sha256 "$APK_SHA256" > notes.md

      # --- Created once, never rewritten. --verify-tag: gh must never create the tag
      # on GitHub (the mirror would delete it); it must already exist, pushed from
      # Gitea. gh uploads the APK to a draft and publishes only after the upload
      # succeeds, deleting the draft on failure, so a failed run can be re-run. ---
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! -s notes.md ]]; then
            echo "::error::release notes were not rendered"
            exit 1
          fi
          # The tag must still point at the commit the APK was built from.
          if ! TAGGED="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"; then
            echo "::error::could not resolve $TAG on GitHub"
            exit 1
          fi
          if [[ "$TAGGED" != "$BUILT_COMMIT" ]]; then
            echo "::error::$TAG now points to $TAGGED, but the APK was built from $BUILT_COMMIT"
            exit 1
          fi
          err="$RUNNER_TEMP/release-view.err"
          if gh release view "$TAG" --json tagName > /dev/null 2> "$err"; then
            echo "::error::a GitHub Release for $TAG already exists (it may be a draft); published release pages are never rewritten"
            exit 1
          fi
          if ! grep -q 'release not found' "$err"; then
            cat "$err" >&2
            echo "::error::could not check for an existing GitHub Release for $TAG"
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP/apk/$APK_NAME" --verify-tag \
            --title "JagHelm Android $VERSION" --notes-file notes.md --latest=false
          echo "created GitHub Release $TAG with $APK_NAME (sha256 $APK_SHA256)"
