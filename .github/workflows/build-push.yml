name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Tests (backend, node:test)
        run: npm test
      - name: Client tests (Vitest + RTL)
        run: npm run test:client
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (report-only during Phase 1 — see docs/IMPROVEMENT-PLAN.md)
        run: npm run lint || true
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
      - name: Asset/link existence check
        run: npm run check:assets

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via the GitHub OIDC token

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute image tags
        id: version
        run: |
          # Short commit SHA → an IMMUTABLE tag that never moves, so a rollback
          # target always exists ("redeploy ghcr.io/...:sha-<short>"). :latest is
          # mutable and is NOT a rollback target.
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          REPO="ghcr.io/jagbhandal/jaghelm"

          # Always publish :latest and the immutable :sha-<short> tag.
          TAGS="${REPO}:latest,${REPO}:sha-${SHORT_SHA}"

          # On a tag/release build, also publish the semver tag.
          VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${REPO}:${VERSION}"
          else
            # Untagged push to main → label the image with the short SHA as its
            # version so `docker inspect` reflects exactly what shipped.
            VERSION="sha-${SHORT_SHA}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          # Feed provenance into the OCI labels the Dockerfile declares so the
          # running image is self-describing / auditable for rollback.
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.image_version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          # NOTE: SBOM + provenance attestations are intentionally NOT set here.
          # build-push-action runs on the runner's default `docker` driver, which
          # rejects attestations ("Attestation is not supported for the docker
          # driver") and fails the whole job. Enabling them requires a buildx
          # container driver — add a `docker/setup-buildx-action@v3` step before
          # this one, then re-add `sbom: true` + `provenance: mode=max`. Tracked
          # as a follow-up; the OCI labels above already make the image auditable.

      # ── TODO: image vulnerability scan (Trivy) — disabled, ready to re-enable ──
      # aquasecurity/trivy-action@v0.28.0 transitively pinned a yanked
      # setup-trivy@v0.2.1 ("unable to find version v0.2.1"), which failed the
      # whole build-push job. Re-enable only with a tag/SHA verified against a real
      # run (Trivy's action has had several broken releases). Non-blocking
      # (exit-code 0) by design; flip to 1 once a triage/allowlist exists.
      # - name: Scan image for vulnerabilities (Trivy)
      #   uses: aquasecurity/trivy-action@<verified-tag-or-sha>
      #   with:
      #     image-ref: ghcr.io/jagbhandal/jaghelm:sha-${{ steps.version.outputs.short_sha }}
      #     format: 'table'
      #     severity: 'HIGH,CRITICAL'
      #     ignore-unfixed: true
      #     exit-code: '0'

      # ── Keyless cosign signing (via the GitHub OIDC token) ────────────────
      # Proves these exact bytes were built by this workflow — no key to manage.
      # Verify host-side before deploy:
      #   cosign verify ghcr.io/jagbhandal/jaghelm@<digest> \
      #     --certificate-identity-regexp 'https://github.com/jagbhandal/jaghelm/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # (see .gitea/workflows/deploy.yml for the deploy-time verify hook).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/jagbhandal/jaghelm@${DIGEST}"

      # ── Event-driven deploy trigger (closes the build→deploy race) ──────────
      # The image is now built, pushed, and signed — tell the Gitea deploy
      # workflow to run NOW, instead of Gitea polling GHCR guessing when the image
      # is ready (see .gitea/workflows/deploy.yml). OFF BY DEFAULT and never fatal:
      # it runs only when the repo variable DEPLOY_DISPATCH_ENABLED == 'true', and
      # `continue-on-error` means a dispatch failure (e.g. an older Gitea without
      # the workflow_dispatch API) just leaves the Gitea push trigger to deploy.
      # Required config + rollout steps: docs/adr/0005-event-driven-deploy.md.
      - name: Trigger Gitea deploy (event-driven, opt-in)
        if: ${{ github.event_name == 'push' && vars.DEPLOY_DISPATCH_ENABLED == 'true' }}
        continue-on-error: true
        env:
          GITEA_DEPLOY_TOKEN: ${{ secrets.GITEA_DEPLOY_TOKEN }}
          GITEA_API_URL: ${{ vars.GITEA_API_URL }}
        run: |
          set -euo pipefail
          : "${GITEA_API_URL:?set the GITEA_API_URL repo variable, e.g. https://git.example.com/api/v1}"
          : "${GITEA_DEPLOY_TOKEN:?set the GITEA_DEPLOY_TOKEN secret (Gitea token, write:repository scope)}"
          echo ">>> Dispatching the Gitea deploy workflow (ref=main)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${GITEA_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITEA_API_URL%/}/repos/jagbhandal/jaghelm/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          case "${code}" in
            200|201|204) echo "    Gitea dispatch accepted (HTTP ${code})" ;;
            *) echo "    WARNING: Gitea dispatch returned HTTP ${code} — relying on the Gitea push-trigger fallback" ;;
          esac
