<?xml version="1.0" encoding="utf-8"?>
<!-- Adaptive icon background source — full-bleed 108dp indigo canvas.
     Subtle radial gradient from #818cf8 (top-centre) to #6366f1 (edges)
     gives a little depth while staying close to flat.  Corners under any
     launcher mask (squircle / circle / square) always show indigo — never white. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
</svg>
