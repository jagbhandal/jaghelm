# .harness.yml — harness conformance manifest for jaghelm.
#
# Assessed against CURRENT main (commit 8e8a6f9, v1.4.0). Levels are the on-disk
# verifiable reality (honest-numbers): runtime/branch-only claims do NOT count.
# Levels & criteria: homelab-infra/docs/harness/MATURITY-RUBRIC.md
# Target bars (web-app): ctx L2 · leg L2 · enf L3 · ver L3 · gc L2 · aut L2.

archetype: web-app

levels:
  # GAP (target L2): structured docs/ exists (ARCHITECTURE.md, 5 ADRs, security/, slos/)
  # but NO AGENTS.md/CLAUDE.md map on main — no agent-facing <=100-line entrypoint into docs/.
  context:      L1
  # = target L2: boots in isolation (server/demo.js + docs/DEMO.md self-contained run);
  # server/metrics.js (prom-client) + server/util/logger.js give one queryable signal class.
  legibility:   L2
  # GAP (target L3): lint is blocking in CI (check.yml on PRs, build-push.yml on main), but the ESLint
  # rules are deliberately lenient and there is no custom structural/dependency enforcer that injects
  # remediation into agent context.
  enforcers:    L2
  # GAP (target L3): no on-disk agent-to-agent review loop that runs before a human looks.
  # CI today: Gitea .gitea/workflows/check.yml (on main since #157, 2026-06-23) runs on every PR to
  # main: secret scan, CHANGELOG format, lint, typecheck, server/web/mobile tests, asset check.
  # GitHub build-push.yml runs on every push to main: tests, npm audit, image build + cosign signing.
  # On tags, release.yml (vX.Y.Z) promotes the already-built :sha-<short> image to :X.Y.Z by digest
  # and publishes the GitHub Release, and build-apk.yml (mobile-vX.Y.Z) builds the signed APK and
  # attaches it to a GitHub Release. The level below is from the audit of 8e8a6f9, which predates
  # check.yml reaching main; levels change only at an audit.
  verification: L1
  # GAP (target L2): no quality-grade / golden-principles doc (no QUALITY_SCORE.md). CHANGELOG +
  # IMPROVEMENT-PLAN are periodic-manual. Per calibration gc L1 = no quality-grade doc.
  gc:           L1
  # = target L2: auto-pr.yml opens staging->main PR (human merges); deploy.yml runs with serialized
  # concurrency + opt-in cosign verify + health-gate backstop = the merge/deploy gate is held by a human.
  autonomy:     L2

evidence:
  context:      [docs/ARCHITECTURE.md, docs/adr/README.md, docs/security/STRIDE.md, docs/slos/README.md]
  legibility:   [server/demo.js, docs/DEMO.md, server/metrics.js, server/util/logger.js, server/observability.test.js]
  enforcers:    [eslint.config.js, .gitea/workflows/check.yml, .github/workflows/build-push.yml]
  verification: [.gitea/workflows/check.yml, .github/workflows/build-push.yml, scripts/check-assets.mjs]
  gc:           [CHANGELOG.md, docs/IMPROVEMENT-PLAN.md]
  autonomy:     [.gitea/workflows/auto-pr.yml, .gitea/workflows/deploy.yml]

last_audited: 2026-06-23
