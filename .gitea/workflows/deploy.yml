name: Deploy JagHelm

# The fast path to production: every push to main deploys that commit as soon
# as its image exists. Reconcile production (reconcile.yml) is the safety net:
# every 5 minutes it deploys main's head if vm-103 runs anything else, so a
# merge whose image lands after this run gave up still ships (#534).
#
# Both workflows run the same deploy, scripts/deploy/deploy.sh, one command per
# step. In order:
#   1. fetch deploy.sh at this commit from Gitea (the runner has no checkout),
#   2. pin vm-103's SSH host key (fails closed without it),
#   3. wait for this commit's image. Main moved past this commit: ends green as
#      superseded. No image within IMAGE_WAIT_SECONDS: ends green, "Image not
#      built yet; the reconcile ships it when it is". Neither touches vm-103.
#   4. verify its signature (opt-in),
#   5. stage: pull the image and deliver this commit's compose.yaml,
#   6. switch: point :latest at the image and recreate the container,
#   7. health gate, which also checks /api/health serves this commit's
#      revision, 8. on a failure once the stage reached vm-103: roll back the
#      image and compose.yaml, and hold the commit back from the reconcile's
#      scheduled runs (deploy-failed),
#   9. prune old images.
#
# A deploy only ever runs this commit's :sha-<short> image. There is no
# automatic fallback to :latest: a green deploy that deployed means this commit
# is live, and a red one is a real failure. What each outcome means, recovery,
# and the manual rollback: docs/RELEASING.md, "Production deploys".
#
# Configuration (Gitea: repository Settings > Actions):
#   VM103_HOST_KEY  variable, required. vm-103's SSH host key as one known_hosts
#                   line: "<vm-103 address> ssh-ed25519 AAAA...". Get it with
#                   `ssh-keyscan -t ed25519 <address>` and check its fingerprint
#                   against `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on
#                   vm-103. It is a variable rather than inline because this repo
#                   is mirrored to a public GitHub repo. Missing or malformed, the
#                   deploy fails before any SSH; after a vm-103 rebuild, update it
#                   or deploys fail with "Host key verification failed".
#   COSIGN_VERIFY   variable, optional. "true" enforces the signature check.
#   (job token)     the automatic GITEA_TOKEN, limited to contents: read below.
#                   Reads deploy.sh, main's head and compose.yaml from the Gitea
#                   API. Nothing to configure.
#
# Host files in the stack dir: compose.yaml is the deploy's (replaced every
# deploy, previous copy in compose.yaml.prev); compose.override.yaml and .env
# are the host's and never touched. compose.accept-drops, created by hand,
# lets ONE deploy drop host networking or a mount the running container has;
# the deploy removes it once that deploy is healthy. deploy-failed names a
# commit whose deploy failed, or that was rolled back by hand; the reconcile
# skips it, and a healthy deploy removes it.
#
# Act_runner caveat: no expression interpolation inside run bodies, comments
# included. Values come in through env: and are used as $VAR.
#
# The steps from "Pin" on, except the wait, are the same in reconcile.yml
# (scripts/deploy-workflow.test.mjs checks they stay identical).

on:
  push:
    branches:
      - main

# One deploy at a time: a push deploy and a reconcile run share this group, so
# they never race on vm-103. A newer run waiting in the group replaces an older
# waiting one (Gitea shows that one as cancelled); the newer one ships main.
concurrency:
  group: deploy-jaghelm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vm103]
    # Explicit bash (#336): the steps use bash-only syntax (set -o pipefail), and
    # act_runner silently falls back to sh on a host without /bin/bash.
    defaults:
      run:
        shell: bash
    # The job token only reads this repo.
    permissions:
      contents: read
    env:
      # The deploy target. Steps reach it only through SSH_CMD, which the pin
      # step exports with the pinned host key.
      VM103_SSH: jagbhandal@192.168.68.11
      STACK_DIR: /opt/stacks/jaghelm
      # How long to wait for this commit's image before leaving it to the
      # reconcile. The GitHub build usually lands within ~5 minutes of a merge.
      IMAGE_WAIT_SECONDS: 360
    steps:
      - name: Fetch the deploy script
        env:
          JOB_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The runner has no checkout. The token reaches curl as a config line
          # on stdin, never on argv.
          DEPLOY_SH="$(mktemp)"
          URL="${SERVER_URL%/}/api/v1/repos/${REPOSITORY}/raw/scripts/deploy/deploy.sh?ref=${GITHUB_SHA}"
          if ! printf 'header = "Authorization: token %s"\n' "${JOB_TOKEN}" \
            | curl -fsS --max-time 30 -K - -o "${DEPLOY_SH}" "${URL}" || [ ! -s "${DEPLOY_SH}" ]; then
            rm -f "${DEPLOY_SH}"
            echo "::error::could not read scripts/deploy/deploy.sh at ${GITHUB_SHA} from Gitea; nothing changed on vm-103. Re-run this workflow."
            exit 1
          fi
          echo "    scripts/deploy/deploy.sh at ${GITHUB_SHA}: sha256=$(sha256sum "${DEPLOY_SH}" | cut -d' ' -f1)"
          echo "DEPLOY_SH=${DEPLOY_SH}" >> "$GITHUB_ENV"

      # Every later SSH verifies vm-103's host key against VM103_HOST_KEY
      # (StrictHostKeyChecking=yes, no global known_hosts) (#211).
      - name: Pin vm-103's SSH host key (fail closed)
        env:
          VM103_HOST_KEY: ${{ vars.VM103_HOST_KEY }}
        run: bash "${DEPLOY_SH:?}" pin

      # Exports DEPLOY_SHA (this commit) only when its image exists and main
      # has not moved past it; every later step does nothing without it.
      - name: Wait for the freshly-built image to be available
        env:
          JOB_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: bash "${DEPLOY_SH:?}" wait

      - name: Verify image signature (cosign, opt-in)
        if: ${{ vars.COSIGN_VERIFY == 'true' }}
        run: bash "${DEPLOY_SH:?}" signature

      - name: Stage this commit on vm-103 (image + compose.yaml)
        env:
          JOB_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: bash "${DEPLOY_SH:?}" stage

      - name: Switch vm-103 to this commit (retag + recreate)
        run: bash "${DEPLOY_SH:?}" switch

      - name: Verify deployment (health gate)
        run: bash "${DEPLOY_SH:?}" verify

      - name: Roll back on failure
        if: failure()
        run: |
          # Without the deploy script (its fetch failed) nothing ran.
          [ -z "${DEPLOY_SH:-}" ] || bash "${DEPLOY_SH}" rollback

      - name: Hold a failed commit back from the reconcile
        if: failure()
        run: |
          # Without the deploy script (its fetch failed) nothing ran.
          [ -z "${DEPLOY_SH:-}" ] || bash "${DEPLOY_SH}" hold

      - name: Prune old JagHelm images
        continue-on-error: true
        run: bash "${DEPLOY_SH:?}" prune

      - name: Remove the pinned known_hosts file and the deploy script
        if: always()
        run: |
          [ -z "${VM103_KNOWN_HOSTS:-}" ] || rm -f "${VM103_KNOWN_HOSTS}"
          [ -z "${DEPLOY_SH:-}" ] || rm -f "${DEPLOY_SH}"
