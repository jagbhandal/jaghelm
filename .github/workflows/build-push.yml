      # - name: Install cosign
      #   uses: sigstore/cosign-installer@v3
      #
      # - name: Sign the published image (keyless)
      #   env:
      #     COSIGN_EXPERIMENTAL: "1"
      #     DIGEST: ${{ steps.build.outputs.digest }}
      #   run: |
      #     cosign sign --yes "ghcr.io/jagbhandal/jaghelm@${DIGEST}"
